name: CI Monolito y Microservicios

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  monolito:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir y levantar monolito
        run: docker compose up -d --build
        working-directory: monolito

      - name: Ejecutar pruebas del monolito
        run: docker compose exec -T app npm test
        working-directory: monolito

      - name: Detener monolito
        if: always()
        run: docker compose down
        working-directory: monolito

  pruebas-microservicios:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        servicio:
          - microservicios/usuarios-service
          - microservicios/productos-service
          - microservicios/pedidos-service

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.servicio }}/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: ${{ matrix.servicio }}

      - name: Ejecutar pruebas automaticas
        run: npm test
        working-directory: ${{ matrix.servicio }}

  construir-microservicios:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Validar configuracion Docker
        run: docker compose config --quiet

      - name: Construir imagenes
        run: docker compose build
