apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolito-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monolito-app
  template:
    metadata:
      labels:
        app: monolito-app
    spec:
      containers:
        - name: app
          image: lefrank27/monolito-app:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: "monolito-db"
            - name: DB_USER
              value: "usuario_app"
            - name: DB_PASSWORD
              value: "clave_segura_123"
            - name: DB_NAME
              value: "proyecto_app"
            - name: DB_PORT
              value: "5432"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: monolito-app
spec:
  type: NodePort
  selector:
    app: monolito-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
